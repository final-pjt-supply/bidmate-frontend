# RDS(PostgreSQL) 데이터소스 — 서비스 지표용.
#
# CloudWatch에는 "오늘 공고가 몇 건 들어와 몇 건 처리됐나"가 없다. 그 값은 bid_table에만
# 있으므로 RDS를 별도 데이터소스로 붙인다.
#
# 계정은 grafana_ro — bid_table SELECT 권한만 있다(2026-07-28 생성, 권한 검증 완료).
# 비밀번호는 이 파일에 넣지 않고 컨테이너 환경변수 POSTGRES_RO_PASSWORD로 주입한다.
# Grafana가 프로비저닝 파일의 $VAR 를 환경변수 값으로 치환한다.
#
#   docker run ... --env POSTGRES_RO_PASSWORD='<비밀번호>' ...
#
# 네트워크: 프론트 EC2 보안그룹(sg-0f268e4ba6413118c)이 RDS 보안그룹
# (sg-0653007f429c719e3)의 5432 인바운드에 등록돼 있어야 한다(2026-07-28 추가).
apiVersion: 1

datasources:
  - name: BidFriend RDS
    uid: bidmate-rds
    type: postgres
    url: bidmate-postgres.cv8i80gskzwz.ap-northeast-2.rds.amazonaws.com:5432
    user: grafana_ro
    isDefault: false
    editable: false
    secureJsonData:
      password: $POSTGRES_RO_PASSWORD
    jsonData:
      # Grafana 10부터 postgres 데이터소스의 접속 DB는 최상위 `database:`가 아니라
      # jsonData.database 로 옮겨졌다. 최상위에 두면 "You do not currently have a
      # default database configured for this data source" 오류가 난다(2026-07-28 실측).
      database: bidmate
      sslmode: require
      postgresVersion: 1600
      timescaledb: false
      # 읽기 전용 계정이지만 Grafana 쪽에서도 한 번 더 막는다.
      maxOpenConns: 3
      maxIdleConns: 1
      connMaxLifetime: 14400
