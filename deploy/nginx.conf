user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 2048;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── 레이트리밋 (실제 접속 IP 기준) ─────────────────────────────
    # AI 채팅·이벤트는 반복 호출 시 Bedrock 비용·백엔드 부하로 이어져 IP당 요청
    # 속도를 제한한다. 초과는 429로 응답한다(limit_req 기본은 503).
    # 참고: nginx가 443을 직접 종단하므로 $binary_remote_addr가 실제 클라 IP다.
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=events_limit:10m rate=60r/m;
    limit_req_status 429;

    include /etc/nginx/bidmate-upstream.conf;

    server {
        listen 80;
        listen [::]:80;
        server_name bidmate.io.kr www.bidmate.io.kr;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name bidmate.io.kr www.bidmate.io.kr;

        ssl_certificate /etc/letsencrypt/live/bidmate.io.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bidmate.io.kr/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # 공통 프록시 설정 — 아래 모든 location이 상속한다(중복 제거).
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # AI 채팅 — 분당 10회, 순간 3회까지 추가 허용(초과 즉시 429).
        location /api/agent/chat {
            limit_req zone=chat_limit burst=3 nodelay;
            proxy_pass http://bidmate_frontend;
        }

        # 이벤트 수집 — 분당 60회, 순간 20회까지 추가 허용(초과 즉시 429).
        location /api/events {
            limit_req zone=events_limit burst=20 nodelay;
            proxy_pass http://bidmate_frontend;
        }

        location / {
            proxy_pass http://bidmate_frontend;
        }
    }
}
