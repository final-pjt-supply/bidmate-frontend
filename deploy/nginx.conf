user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 2048;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── ALB 뒤에 있으므로 실제 클라이언트 IP를 복원한다 (#197) ────────────
    # ALB가 앞에 서면 $remote_addr/$binary_remote_addr이 ALB의 사설 IP가 된다.
    # 그대로 두면 아래 레이트리밋이 "ALB 1개"를 기준으로 세어 사실상 무력화된다.
    # ALB ENI는 VPC 안에만 있으므로 신뢰 대역을 VPC CIDR로 한정한다.
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── 레이트리밋 (복원된 실제 접속 IP 기준) ─────────────────────────
    # 이벤트 수집은 백엔드에 별도 방어가 없어 IP당 속도를 제한한다.
    # 초과는 429로 응답한다(limit_req 기본은 503).
    #
    # AI 채팅(/api/agent/chat)은 여기서 제한하지 않는다(#200) — 백엔드가
    # enforce_chat_limits로 '회사별' 분당·동시성·일일 상한을 Bedrock 호출 직전에
    # 막는다. IP 기준은 그보다 약할 뿐 아니라 해롭다: 회사 사무실은 공인 IP를
    # 공유하므로 같은 회사 직원 여러 명이 서로를 차단한다.
    #
    # ⚠ 이 카운터는 nginx 프로세스 메모리라 인스턴스별로 따로다 — 서버가 2대면
    # 실효 제한이 2배가 된다. 이벤트 수집에선 그 정도 여유를 감수한다.
    limit_req_zone $binary_remote_addr zone=events_limit:10m rate=60r/m;
    limit_req_status 429;

    include /etc/nginx/bidmate-upstream.conf;

    # ── 구 도메인·www 정규화 ──────────────────────────────────────────
    # SSL 종단과 80→443 리다이렉트는 ALB 리스너가 담당한다. 여기 남은 리다이렉트는
    # "어느 호스트로 들어왔든 정식 URL 하나로 합치는" 용도뿐이다(검색엔진·세션 분리 방지).
    server {
        listen 80;
        listen [::]:80;
        server_name bidmate.io.kr www.bidmate.io.kr www.bidfriend.ai.kr;

        # 헬스체크는 리다이렉트 대상에서 뺀다. ALB는 200을 기대하는데 301을 받으면
        # Target.ResponseCodeMismatch로 인스턴스를 unhealthy 처리한다(#197의 원인).
        # ALB 헬스체크는 Host 헤더를 보내지 않을 수 있어 이 블록에도 필요하다.
        location = /health {
            proxy_pass http://bidmate_frontend;
        }

        location / {
            return 301 https://bidfriend.ai.kr$request_uri;
        }
    }

    # ── 정식 호스트 + 기본 서버 ───────────────────────────────────────
    # default_server를 겸한다 — ALB 헬스체크처럼 Host가 비거나 다른 값이어도
    # 여기로 들어와 정상 응답한다.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name bidfriend.ai.kr _;

        # 공통 프록시 설정 — 아래 모든 location이 상속한다(중복 제거).
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 스킴은 ALB가 판단한 값을 그대로 넘긴다($scheme은 여기선 항상 http다).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        location = /health {
            proxy_pass http://bidmate_frontend;
        }

        # 이벤트 수집 — 분당 60회, 순간 20회까지 추가 허용(초과 즉시 429).
        location /api/events {
            limit_req zone=events_limit burst=20 nodelay;
            proxy_pass http://bidmate_frontend;
        }

        location / {
            proxy_pass http://bidmate_frontend;
        }
    }
}
