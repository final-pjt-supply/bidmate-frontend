<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BidFriend — 서버 이전 중</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f8fafc; --fg: #0f172a; --sub: #475569; --accent: #2563eb; --card: #ffffff; --border: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --fg: #f1f5f9; --sub: #94a3b8; --accent: #60a5fa; --card: #1e293b; --border: #334155; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    min-height: 100svh; display: grid; place-items: center; padding: 24px;
  }
  main { max-width: 420px; width: 100%; text-align: center; }
  .logo { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 28px; }
  .logo span { color: var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 36px 28px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
  }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent);
    border: 1px solid currentColor; border-radius: 999px; padding: 4px 12px; margin-bottom: 18px;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  p { font-size: 15px; line-height: 1.7; color: var(--sub); }
  .foot { margin-top: 24px; font-size: 13px; color: var(--sub); }
  .foot a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="logo">Bid<span>Friend</span></div>
  <div class="card">
    <div class="badge">서버 이전 작업 중</div>
    <h1>잠시 쉬어가는 중입니다</h1>
    <p>
      BidFriend는 더 안정적인 환경으로 서버를 이전하고 있습니다.<br>
      나라장터 공고 추천 서비스는 이전 완료 후 다시 만나요.
    </p>
  </div>
  <div class="foot">
    문의 · <a href="mailto:bidmatefinal@gmail.com">bidmatefinal@gmail.com</a>
  </div>
</main>
</body>
</html>
