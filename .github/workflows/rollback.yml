name: Rollback

# 이미 ECR에 있는 이미지를 그대로 재배포한다. 빌드를 건너뛰므로 30초 안에 끝난다.
#
# deploy.yml에 합치지 않고 파일을 나눈 이유:
#   배포 워크플로가 망가진 상황에서도 롤백은 동작해야 한다. 한 파일에 조건문으로
#   섞으면 deploy 경로의 실수가 롤백까지 같이 마비시킨다.
#
# 실행 방법: Actions 탭 → Rollback → Run workflow
#   - Use workflow from: 되돌릴 시점의 브랜치/태그(보통 main)
#     배포 스크립트와 nginx.conf는 '여기서 고른 ref'의 것이 EC2로 전송된다.
#     앱 이미지만 되돌리면 되는 평상시에는 main 그대로 두면 된다.
#   - image_tag: 되돌릴 커밋 SHA (= ECR 이미지 태그)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "되돌릴 커밋 SHA 40자 (ECR 이미지 태그). 예: 9bc30b25ec0ec7088e0b0aedb79a94ee2547ac0e"
        required: true
        type: string

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: bidmate-frontend
  # deploy.yml과 같은 목록을 유지해야 한다 — 한쪽만 되돌리면 두 서버가 다른
  # 버전을 서비스한다(#197).
  EC2_INSTANCE_IDS: "i-054a12633e0093178 i-08977e1bc16bb21ee"
  # deploy.yml과 같은 값을 유지해야 한다. 한쪽만 바꾸면 롤백 후 백엔드를 못 찾는다.
  API_BASE_URL: http://10.0.140.134:8000

jobs:
  rollback:
    runs-on: ubuntu-latest
    # deploy.yml과 같은 그룹이라 배포와 롤백이 겹쳐 실행되지 않는다.
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    # OIDC로 AWS 임시 자격증명을 받기 위해 필수. 없으면 인증 실패.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890608337282:role/bidmate-frontend-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 없는 태그로 시작하면 EC2에서 docker pull이 실패해 시간만 버린다. 먼저 막는다.
      - name: Verify image exists
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -e
          if ! aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "ECR에 해당 태그가 없다: $TAG" >&2
            echo "최근 태그 목록:" >&2
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --query 'reverse(sort_by(imageDetails,&imagePushedAt))[:10].imageTags[0]' \
              --output text >&2
            exit 1
          fi
          echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_ENV"

      # deploy.yml의 배포 스텝과 동일하다. 스크립트가 이미 슬롯 전환·헬스체크·자동
      # 롤백을 처리하므로, 롤백도 '이전 이미지로 하는 평범한 배포'일 뿐이다.
      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # SSM 명령 코멘트에 짧은 SHA를 남기기 위해 필요하다.
          TAG: ${{ inputs.image_tag }}
        run: |
          set -e
          DEPLOY_SCRIPT_B64=$(base64 -w 0 deploy/blue-green-deploy.sh)
          NGINX_CONFIG_B64=$(base64 -w 0 deploy/nginx.conf)

          jq -n \
            --arg deploy_script "$DEPLOY_SCRIPT_B64" \
            --arg nginx_config "$NGINX_CONFIG_B64" \
            --arg registry "$REGISTRY" \
            --arg region "$AWS_REGION" \
            --arg image "$IMAGE" \
            --arg api_base_url "$API_BASE_URL" \
            '{
              commands: [
                "set -e",
                "install -d -m 0755 /opt/bidmate-frontend",
                ("printf %s " + ($deploy_script | @sh) + " | base64 -d > /opt/bidmate-frontend/deploy.sh"),
                ("printf %s " + ($nginx_config | @sh) + " | base64 -d > /opt/bidmate-frontend/nginx.conf"),
                "chmod 0755 /opt/bidmate-frontend/deploy.sh",
                ("aws ecr get-login-password --region " + ($region | @sh) + " | docker login --username AWS --password-stdin " + ($registry | @sh)),
                ("docker pull " + ($image | @sh)),
                ("IMAGE=" + ($image | @sh) + " API_BASE_URL=" + ($api_base_url | @sh) + " /opt/bidmate-frontend/deploy.sh")
              ]
            }' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids $EC2_INSTANCE_IDS \
            --document-name AWS-RunShellScript \
            --comment "rollback to ${TAG::7}" \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # wait/get-command-invocation은 인스턴스 단수만 받으므로 대상마다 확인한다.
          FAILED=""
          for ID in $EC2_INSTANCE_IDS; do
            echo "===== $ID ====="
            # 실패해도 아래에서 상태/로그를 찍기 위해 || true
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$ID" || true

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$ID" \
              --query Status --output text)
            echo "--- stdout ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query StandardOutputContent --output text
            echo "--- stderr ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query StandardErrorContent --output text

            echo "status: $STATUS"
            [ "$STATUS" = "Success" ] || FAILED="$FAILED $ID"
          done

          if [ -n "$FAILED" ]; then
            echo "롤백 실패 인스턴스:$FAILED" >&2
            exit 1
          fi

      - name: Summary
        run: |
          echo "### 롤백 완료 :rewind:" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
