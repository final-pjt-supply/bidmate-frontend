name: CI & Deploy

# PR      → ci 잡만 실행 (머지 전 검증)
# main push → ci 통과 후 deploy (이미지 빌드 → ECR → EC2 배포)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: bidmate-frontend
  EC2_INSTANCE_ID: i-054a12633e0093178
  # 백엔드 주소(사설 IP). 컨테이너 실행 시 런타임 주입 → 바뀌면 여기만 수정.
  API_BASE_URL: http://10.0.140.134:8000
  # Cognito 식별자 — 브라우저에 노출되는 공개 값이라 비밀이 아니다(Secrets 불필요).
  # NEXT_PUBLIC_* 는 빌드 시점에 번들로 들어가므로 docker build --build-arg 로 넘긴다.
  NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-northeast-2_zKCsxvDzO
  NEXT_PUBLIC_COGNITO_CLIENT_ID: 43m2oj69ak8jlkodnt3m2o485q

jobs:
  # ── 검증: 타입·린트·빌드가 통과해야 배포로 넘어간다 ──────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Dockerfile의 node:22-alpine과 맞춤
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Validate deployment scripts
        run: bash -n deploy/blue-green-deploy.sh

      - name: Build
        run: npm run build

  # ── 배포: main에 머지됐을 때만 ──────────────────────────────────
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    # OIDC로 AWS 임시 자격증명을 받기 위해 필수. 없으면 인증 실패.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890608337282:role/bidmate-frontend-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 아래 SSM 스텝이 $IMAGE 를 참조하므로 태그를 먼저 확정해 둔다.
      - name: Resolve image tag
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> "$GITHUB_ENV"

      # 러너는 매 실행마다 새 VM이라 로컬 레이어 캐시가 남지 않는다.
      # buildx + GitHub Actions 캐시로 레이어를 외부에 보관해 재사용한다.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ env.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ env.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          # mode=max 여야 deps·builder 같은 중간 스테이지까지 캐시된다.
          # 기본값(min)은 최종 이미지 레이어만 담아 멀티스테이지에선 효과가 없다.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance 첨부물이 붙으면 매니페스트가 인덱스로 바뀐다.
          # 배포 스크립트는 단일 이미지를 pull하는 전제라 끈다.
          provenance: false

      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -e
          DEPLOY_SCRIPT_B64=$(base64 -w 0 deploy/blue-green-deploy.sh)
          NGINX_CONFIG_B64=$(base64 -w 0 deploy/nginx.conf)

          jq -n \
            --arg deploy_script "$DEPLOY_SCRIPT_B64" \
            --arg nginx_config "$NGINX_CONFIG_B64" \
            --arg registry "$REGISTRY" \
            --arg region "$AWS_REGION" \
            --arg image "$IMAGE" \
            --arg api_base_url "$API_BASE_URL" \
            '{
              commands: [
                "set -e",
                "install -d -m 0755 /opt/bidmate-frontend",
                ("printf %s " + ($deploy_script | @sh) + " | base64 -d > /opt/bidmate-frontend/deploy.sh"),
                ("printf %s " + ($nginx_config | @sh) + " | base64 -d > /opt/bidmate-frontend/nginx.conf"),
                "chmod 0755 /opt/bidmate-frontend/deploy.sh",
                ("aws ecr get-login-password --region " + ($region | @sh) + " | docker login --username AWS --password-stdin " + ($registry | @sh)),
                ("docker pull " + ($image | @sh)),
                ("IMAGE=" + ($image | @sh) + " API_BASE_URL=" + ($api_base_url | @sh) + " /opt/bidmate-frontend/deploy.sh")
              ]
            }' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # 완료까지 대기 (실패해도 아래에서 상태/로그를 찍기 위해 || true)
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

      - name: Summary
        run: |
          echo "### 배포 완료 :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
