name: CI & Deploy

# PR      → ci 잡만 실행 (머지 전 검증)
# main push → ci 통과 후 deploy (이미지 빌드 → ECR → EC2 배포)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: bidmate-frontend
  # ALB(app/bidmate-frontend) 타겟그룹에 등록된 인스턴스 전체. 공백 구분이며
  # 인스턴스를 늘리면 여기에 추가해야 한다 — 빠뜨리면 그 서버만 옛 코드로
  # 트래픽을 받는다(#197에서 실제로 겪었다).
  EC2_INSTANCE_IDS: "i-054a12633e0093178 i-08977e1bc16bb21ee"
  # Grafana 컨테이너가 /etc/grafana 로 마운트하는 호스트 경로.
  # 레포 변수(vars.GRAFANA_DIR)로 덮어쓸 수 있다 — 경로가 바뀌어도 코드 수정 불요.
  # 확인법: docker inspect <grafana> --format '{{json .Mounts}}'
  GRAFANA_DIR: ${{ vars.GRAFANA_DIR }}
  # 백엔드 주소(사설 IP). 컨테이너 실행 시 런타임 주입 → 바뀌면 여기만 수정.
  API_BASE_URL: http://10.0.140.134:8000
  # Cognito 식별자 — 브라우저에 노출되는 공개 값이라 비밀이 아니다(Secrets 불필요).
  # NEXT_PUBLIC_* 는 빌드 시점에 번들로 들어가므로 docker build --build-arg 로 넘긴다.
  NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-northeast-2_zKCsxvDzO
  NEXT_PUBLIC_COGNITO_CLIENT_ID: 43m2oj69ak8jlkodnt3m2o485q
  # 비드봇 공개 스위치(#140). "true"일 때만 켜진다 — 끄려면 이 줄을 지우거나 값을
  # 바꾸고 재배포하면 된다. 켜면 /agent/chat이 Bedrock 동기 호출로 이어져 과금이
  # 발생하므로, 백엔드의 회사별 레이트리밋이 살아 있는지 확인하고 켤 것.
  NEXT_PUBLIC_BIDBOT_ENABLED: "true"

jobs:
  # ── 검증: 타입·린트·빌드가 통과해야 배포로 넘어간다 ──────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Dockerfile의 node:22-alpine과 맞춤
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:ci

      - name: Validate deployment scripts
        run: bash -n deploy/blue-green-deploy.sh

      # main push 시에는 건너뛴다 — 같은 커밋을 PR에서 이미 빌드했고,
      # 아래 deploy 잡의 docker build가 같은 next build를 다시 돌린다.
      # 거기서 실패하면 배포는 시작되지 않으므로 게이트는 유지된다.
      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build

  # ── 배포: main에 머지됐을 때만 ──────────────────────────────────
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    # OIDC로 AWS 임시 자격증명을 받기 위해 필수. 없으면 인증 실패.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890608337282:role/bidmate-frontend-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 아래 SSM 스텝이 $IMAGE 를 참조하므로 태그를 먼저 확정해 둔다.
      - name: Resolve image tag
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> "$GITHUB_ENV"

      # 러너는 매 실행마다 새 VM이라 로컬 레이어 캐시가 남지 않는다.
      # buildx + GitHub Actions 캐시로 레이어를 외부에 보관해 재사용한다.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # NEXT_PUBLIC_SENTRY_RELEASE 는 이미지 태그와 같은 커밋 SHA다.
          # (이 블록 안에는 주석을 넣지 않는다 — 값이 아니라 문자열 목록이라
          #  '#' 줄까지 빌드 인자로 전달된다)
          build-args: |
            NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ env.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ env.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_BIDBOT_ENABLED=${{ env.NEXT_PUBLIC_BIDBOT_ENABLED }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
          # mode=max 여야 deps·builder 같은 중간 스테이지까지 캐시된다.
          # 기본값(min)은 최종 이미지 레이어만 담아 멀티스테이지에선 효과가 없다.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance 첨부물이 붙으면 매니페스트가 인덱스로 바뀐다.
          # 배포 스크립트는 단일 이미지를 pull하는 전제라 끈다.
          provenance: false

      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -e
          DEPLOY_SCRIPT_B64=$(base64 -w 0 deploy/blue-green-deploy.sh)
          NGINX_CONFIG_B64=$(base64 -w 0 deploy/nginx.conf)
          # Grafana 대시보드 JSON 을 폴더째 실어 보낸다. 프로비저닝 provider 가
          # 30초마다 폴더를 다시 읽으므로(deploy/grafana/provisioning/dashboards/
          # bidmate.yaml) 컨테이너 재시작 없이 반영된다.
          GRAFANA_DIR="${GRAFANA_DIR:-/opt/bidmate-grafana}"
          DASHBOARDS_B64=$(tar -C deploy/grafana -cz dashboards | base64 -w 0)

          jq -n \
            --arg deploy_script "$DEPLOY_SCRIPT_B64" \
            --arg nginx_config "$NGINX_CONFIG_B64" \
            --arg dashboards "$DASHBOARDS_B64" \
            --arg grafana_dir "$GRAFANA_DIR" \
            --arg registry "$REGISTRY" \
            --arg region "$AWS_REGION" \
            --arg image "$IMAGE" \
            --arg api_base_url "$API_BASE_URL" \
            '{
              commands: [
                "set -e",
                "install -d -m 0755 /opt/bidmate-frontend",
                ("printf %s " + ($deploy_script | @sh) + " | base64 -d > /opt/bidmate-frontend/deploy.sh"),
                ("printf %s " + ($nginx_config | @sh) + " | base64 -d > /opt/bidmate-frontend/nginx.conf"),
                "chmod 0755 /opt/bidmate-frontend/deploy.sh",
                ("install -d -m 0755 " + ($grafana_dir | @sh)),
                ("printf %s " + ($dashboards | @sh) + " | base64 -d | tar -C " + ($grafana_dir | @sh) + " -xz || echo GRAFANA_SYNC_FAILED"),
                ("ls -1 " + ($grafana_dir | @sh) + "/dashboards || true"),
                ("aws ecr get-login-password --region " + ($region | @sh) + " | docker login --username AWS --password-stdin " + ($registry | @sh)),
                ("docker pull " + ($image | @sh)),
                ("IMAGE=" + ($image | @sh) + " API_BASE_URL=" + ($api_base_url | @sh) + " /opt/bidmate-frontend/deploy.sh")
              ]
            }' > /tmp/params.json

          # ALB 타겟그룹의 모든 인스턴스에 같은 명령을 보낸다. 한 대만 배포하면
          # 나머지가 옛 코드로 트래픽을 받는다(#197).
          CMD_ID=$(aws ssm send-command \
            --instance-ids $EC2_INSTANCE_IDS \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # wait/get-command-invocation은 인스턴스 단수만 받으므로 대상마다 확인한다.
          # 한 대라도 실패하면 실패로 끝내되, 로그는 전부 찍고 나서 판정한다 —
          # 일부만 성공한 상태(=버전 혼재)를 조용히 넘기지 않기 위함이다.
          FAILED=""
          for ID in $EC2_INSTANCE_IDS; do
            echo "===== $ID ====="
            # 실패해도 아래에서 상태/로그를 찍기 위해 || true
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$ID" || true

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$ID" \
              --query Status --output text)
            echo "--- stdout ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query StandardOutputContent --output text
            echo "--- stderr ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query StandardErrorContent --output text

            echo "status: $STATUS"
            [ "$STATUS" = "Success" ] || FAILED="$FAILED $ID"
          done

          if [ -n "$FAILED" ]; then
            echo "배포 실패 인스턴스:$FAILED" >&2
            exit 1
          fi

      - name: Summary
        run: |
          echo "### 배포 완료 :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
